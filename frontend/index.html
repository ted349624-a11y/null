<style>

  .wmenu .who { padding:8px 10px 10px; border-bottom:1px solid var(--line); margin-bottom:4px; }

  .wmenu .who .b { font-size:13px; margin-top:4px; }

  .wmenu button:hover { background:#1a1d21; }

  input, select { width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px; color:var(--txt); padding:11px 12px; font:16px ui-monospace, Menlo, monospace; outline:0; }
  input:focus, select:focus { border-color:var(--acc); }

  #toast.show { opacity:1; transform:translateX(-50%); }

  /* list */

  @media (max-width:860px) {

    main { padding:16px 12px 50px; }

<script>
(() => {
"use strict";
const CFG = window.NULL_NFT;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
let toastT;
const toast = (m, ms = 3200) => { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); };

if (!CFG || !CFG.factory) { $("view").innerHTML = '<div class="card empty">NFT launches are coming soon.</div>'; return; }
$("net").textContent = CFG.chainName;
if (CFG.explorer) $("fCa").href = `${CFG.explorer}/address/${CFG.factory}#code`; // follows the deployed factory

// ---------------------------------------------------------------- contracts
const INFO_T = "tuple(address collection,address coin,address creator,string name,string symbol,uint256 nftSupply,uint256 perNFT,uint256 mintPrice,uint256 mintEnd,uint256 maxPerWallet,uint256 minted,uint256 publicCap,uint256 totalNFTs,uint256 vaultSize,bool finalized,uint256 mintFeeBps,uint256 lpBps,bytes32 seed)";
const ERRORS = ["error WrongLaunchFee()", "error BadText()", "error BadSupply()", "error UnevenSplit()", "error BadPrice()", "error BadDuration()", "error BadWalletLimit()", "error MintClosed()", "error BadQuantity()", "error WrongValue()", "error SoldOut()", "error WalletLimit()", "error AlreadyFinalized()", "error MintRunning()", "error NotOpen()", "error NotOwner()", "error VaultTooSmall()", "error NoPool()", "error NothingOwed()"];
const FACTORY_ABI = [
  "function createCollection((string name,string symbol,uint32 nftSupply,uint256 coinSupply,uint256 mintPrice,uint64 duration,uint32 maxPerWallet) p) payable returns (address collection, address coin)",
  "function launchFee() view returns (uint256)", "function mintFeeBps() view returns (uint16)", "function lpBps() view returns (uint16)", "function creatorFeeBps() view returns (uint16)",
  "function collectionsCount() view returns (uint256)", `function latest(uint256 start, uint256 count) view returns (${INFO_T}[])`,
  "function collectFees(address collection) returns (uint256 eth, uint256 coins)", "function liquidityOf(address) view returns (uint128)", "function creatorFeeBpsOf(address) view returns (uint16)",
  "function owed(address) view returns (uint256)", "function withdrawOwed()",
  "event CollectionCreated(address indexed collection, address indexed coin, address indexed creator, string name, string symbol, uint256 nftSupply, uint256 coinSupply, uint256 mintPrice, uint256 mintEnd)",
  ...ERRORS,
];
const COLLECTION_ABI = [
  `function info() view returns (${INFO_T})`, "function mint(uint256 quantity) payable", "function finalize()", "function toCoins(uint256[] ids)", "function toNFTs(uint256 n) returns (uint256[])",
  "function ownedIds(address owner, uint256 from, uint256 count) view returns (uint256[])", "function mintedBy(address) view returns (uint256)", "function owed(address) view returns (uint256)", "function withdrawOwed()",
  "event ToNFTs(address indexed account, uint256[] ids, uint256 coins)", ...ERRORS,
];
const COIN_ABI = ["function balanceOf(address) view returns (uint256)", "function allowance(address,address) view returns (uint256)", "function approve(address,uint256) returns (bool)", "function totalSupply() view returns (uint256)"];
const PERMIT2_ABI = ["function allowance(address owner, address token, address spender) view returns (uint160 amount, uint48 expiration, uint48 nonce)", "function approve(address token, address spender, uint160 amount, uint48 expiration)"];
const ROUTER_ABI = ["function execute(bytes commands, bytes[] inputs, uint256 deadline) payable"];
const KEY_T = "tuple(address,address,uint24,int24,address)";
const QUOTER_ABI = [`function quoteExactInputSingle(tuple(${KEY_T} poolKey, bool zeroForOne, uint128 exactAmount, bytes hookData) params) returns (uint256 amountOut, uint256 gasEstimate)`];
const STATEVIEW_ABI = ["function getSlot0(bytes32) view returns (uint160 sqrtPriceX96, int24 tick, uint24 protocolFee, uint24 lpFee)"];

const rp = new ethers.JsonRpcProvider(CFG.rpcUrl, CFG.chainId, { staticNetwork: true, batchMaxCount: 1 });
const factoryR = new ethers.Contract(CFG.factory, FACTORY_ABI, rp);
const coder = ethers.AbiCoder.defaultAbiCoder();
const keyOf = (coin) => [ethers.ZeroAddress, coin, 10000, 200, ethers.ZeroAddress];
const poolIdOf = (coin) => ethers.keccak256(coder.encode(["address", "address", "uint24", "int24", "address"], keyOf(coin)));

// ---------------------------------------------------------------- formatting
const E18 = 10n ** 18n;
function fmtUnits(v, max = 6) {
  v = BigInt(v);
  const neg = v < 0n; if (neg) v = -v;
  const whole = v / E18, frac = v % E18;
  let f = frac.toString().padStart(18, "0").slice(0, max).replace(/0+$/, "");
  if (whole === 0n && !f && frac > 0n) return (neg ? "-" : "") + "<0." + "0".repeat(max - 1) + "1";
  return (neg ? "-" : "") + whole.toLocaleString("en-US") + (f ? "." + f : "");
}
const fmtEth = (v, max = 6) => fmtUnits(v, max) + " ETH";
const plural = (n, w) => `${n} ${w}${Number(n) === 1 ? "" : "s"}`;
function timeLeft(sec) {
  if (sec <= 0) return "ended";
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
}
const now = () => Math.floor(Date.now() / 1000);
function errMsg(e) {
  const name = e?.revert?.name || (String(e?.shortMessage || e?.message || "").match(/custom error '(\w+)/) || [])[1];
  const map = {
    WrongLaunchFee: "The launch fee changed. Reload and try again.", BadText: "Use letters, numbers and simple punctuation (no quotes or < > &).",
    BadSupply: "NFT supply must be 2 to 10,000 and coin supply 1 to 1,000,000,000,000.", UnevenSplit: "The coin supply must split evenly between the NFTs.",
    BadPrice: "Mint price must be between 0.000000001 and 100 ETH.", BadDuration: "Mint duration must be between 5 minutes and 30 days.", BadWalletLimit: "The wallet limit can't be more than the NFT supply.",
    MintClosed: "The mint has ended.", BadQuantity: "Pick a smaller amount (up to 20 per mint, 50 per conversion).", WrongValue: "Wrong amount of ETH.", SoldOut: "Not that many NFTs left.",
    WalletLimit: "That would go over the per-wallet limit.", AlreadyFinalized: "Trading is already open.", MintRunning: "The mint is still running.", NotOpen: "Conversions open when trading opens.",
    NotOwner: "You don't own that NFT.", VaultTooSmall: "Not enough NFTs in the vault right now.", NoPool: "No pool yet.", NothingOwed: "Nothing to withdraw.",
  };
  if (map[name]) return map[name];
  if (e?.code === "ACTION_REJECTED" || e?.info?.error?.code === 4001) return "Rejected in wallet.";
  if (e?.code === "INSUFFICIENT_FUNDS" || /insufficient funds/i.test(e?.message || "")) return `Not enough ${NET} for this (and gas). Get free test ETH from the links at the top.`;
  if (/missing revert data/i.test(e?.shortMessage || e?.message || "")) return `The wallet could not send this. Make sure it is on ${CFG.chainName} and has some test ETH.`;
  return e?.shortMessage || e?.reason || e?.message || String(e);
}

// ---------------------------------------------------------------- art (same drawing as NullNFTArt.sol)
const artCache = new Map();
function artSvg(seed, id, symbol) {
  const h = BigInt(ethers.keccak256(coder.encode(["bytes32", "uint256"], [seed, id])));
  const hue = (BigInt(seed) % 360n).toString();
  let body = "";
  for (let y = 0; y < 8; y++) for (let x = 0; x < 4; x++) {
    const bit = BigInt(y * 4 + x);
    if (((h >> bit) & 1n) === 0n) continue;
    const shade = (h >> (32n + bit * 2n)) & 3n;
    const fill = `hsl(${hue},85%,${(38n + shade * 14n).toString()}%)`;
    for (const cx of [x, 7 - x]) body += `<rect x="${64 + cx * 48}" y="${64 + y * 48}" width="44" height="44" rx="6" fill="${fill}"/>`;
  }
  const label = esc(symbol) + (id ? ` #${id}` : "");
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#08090b"/>${body}<text x="64" y="488" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#eceff1">${label}</text><text x="448" y="488" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="22" font-weight="700" fill="#eceff1">null<tspan fill="#c6ff3d">_</tspan></text></svg>`;
}
function artUrl(seed, id, symbol) {
  const k = seed + ":" + id;
  if (!artCache.has(k)) artCache.set(k, "data:image/svg+xml;base64," + btoa(artSvg(seed, id, symbol)));
  return artCache.get(k);
}

// ---------------------------------------------------------------- wallet
let signer = null, account = null, wrongNet = false, ethBal = null;
const DISC_KEY = "null_nft_disconnected";
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const NET = `${CFG.chainName} test ETH`;
const walletChain = async () => parseInt(await window.ethereum.request({ method: "eth_chainId" }), 16);

// The wallet must really be on our chain before anything is signed: some wallets ignore a switch request
// silently, and a transaction would then go to whatever network they are on.
async function ensureChain() {
  if ((await walletChain()) === CFG.chainId) { wrongNet = false; return; }
  const hex = "0x" + CFG.chainId.toString(16);
  try { await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] }); }
  catch (e) {
    if (e.code === 4902 || e?.data?.originalError?.code === 4902 || /unrecognized chain|not added|unknown chain/i.test(e.message || "")) {
      await window.ethereum.request({ method: "wallet_addEthereumChain", params: [{ chainId: hex, chainName: CFG.chainName, rpcUrls: [CFG.rpcUrl], nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 }, blockExplorerUrls: [CFG.explorer] }] });
    } else if (e.code !== 4001) { /* fall through to the check below */ } else throw e;
  }
  if ((await walletChain()) !== CFG.chainId) {
    wrongNet = true; walletUI();
    throw new Error(`Your wallet is on another network. Switch it to ${CFG.chainName} (chain ${CFG.chainId}) and try again.`);
  }
  wrongNet = false;
}
async function connect() {
  if (!window.ethereum) {
    location.href = "https://metamask.app.link/dapp/" + location.host + location.pathname + location.hash;
    return;

// Gas use varies a little between the estimate and the real block (coins -> NFT picks a random vault slot),
// so every transaction gets 25% (+20k) of headroom over the estimate.
function lowFunds(bal, needed) {
  return new Error(`Not enough ${NET}: you have ${fmtEth(bal)}, this needs about ${fmtEth(needed)} with gas. Get free test ETH from the links at the top of the page.`);
}
async function call(contract, method, args = [], overrides = {}) {
  await ensureChain();
  const to = await contract.getAddress(), data = contract.interface.encodeFunctionData(method, args), value = overrides.value || 0n;
  const bal = await rp.getBalance(account);
  let est;
  try { est = await rp.estimateGas({ from: account, to, data, value }); }
  catch (e) {
    const d = e?.data || e?.info?.error?.data;
    if (typeof d === "string" && d.length >= 10) { let pe = null; try { pe = contract.interface.parseError(d); } catch {} if (pe) throw Object.assign(new Error(pe.name), { revert: { name: pe.name } }); }
    if (bal < value + 10n ** 13n) throw lowFunds(bal, value + 10n ** 13n);
    throw e;
  }
  const gasLimit = (est * 125n) / 100n + 20000n;
  const fee = await rp.getFeeData().catch(() => ({}));
  const needed = value + gasLimit * (fee.maxFeePerGas || fee.gasPrice || 0n);
  if (bal < needed) throw lowFunds(bal, needed);
  return contract[method](...args, { ...overrides, gasLimit });
}
async function send(label, fn) {
  const t = await fn();
  toast(`${label}: waiting for confirmation…`, 60000);
  const rc = await t.wait();
  toast(`${label}: done ✓`);
  refreshBal();
  return rc;
}

  const c = S.info;
  return `<div class="card">
    <div class="row between"><h2>Trade $${esc(c.symbol)}</h2><span class="mut tiny">Uniswap v4 · 1% fee</span></div>
    <div class="seg" style="margin-top:10px"><button id="sBuy" class="${S.side === "buy" ? "on" : ""}">Buy</button><button id="sSell" class="${S.side === "sell" ? "on" : ""}">Sell</button></div>
    <label for="amt">${S.side === "buy" ? "You pay (ETH)" : `You sell (${esc(c.symbol)})`}</label>
    <input id="amt" inputmode="decimal" placeholder="0.0">
    <div class="row between tiny mut" style="margin-top:6px"><span>Balance: ${S.side === "buy" ? `${fmtEth(S.bal.eth)} (${esc(CFG.chainName)})` : `${fmtUnits(S.bal.coin)} ${esc(c.symbol)}`}</span>${S.side === "sell" && S.bal.coin > 0n ? '<button class="link" id="amtMax">Max</button>' : ""}</div>
    <div class="quote" id="quote"></div>
    <button class="wide" id="tradeBtn" style="margin-top:10px">${S.side === "buy" ? "Buy" : "Sell"}</button>
    <div class="tiny mut" style="margin-top:8px">Up to 3% price movement allowed. Coins also trade anywhere Uniswap v4 is supported.</div>
    <div class="err" id="tradeErr"></div>
  </div>`;
}
function convertPanel() {
  const c = S.info, per = c.perNFT;
  const canNfts = per > 0n ? Number(S.bal.coin / per) : 0, maxBack = Math.min(50, canNfts, Number(c.vaultSize));
  const mine = S.my.length;
  return `<div class="card">
    <h2>NFT ⇄ coins</h2>
    <div class="mut small">1 NFT = ${fmtUnits(per)} ${esc(c.symbol)}, both ways.</div>
    <div style="margin-top:14px" class="row between"><b class="small">Your NFTs (${mine})</b>${mine ? `<button class="link" id="selAll">${S.sel.size === Math.min(mine, 50) ? "Clear" : "Select all"}</button>` : ""}</div>
    ${!account ? '<div class="mut small" style="margin-top:6px">Connect your wallet to see your NFTs.</div>' : mine ? `<div class="nfts" id="nfts">${S.my.slice(0, 300).map((id) => `<div class="nft ${S.sel.has(id) ? "sel" : ""}" data-id="${id}"><img alt="" loading="lazy" src="${artUrl(c.seed, id, c.symbol)}"><span class="id">#${id}</span></div>`).join("")}</div>` : '<div class="mut small" style="margin-top:6px">You have no NFTs from this collection.</div>'}
    <button class="wide" id="toCoinsBtn" style="margin-top:12px" ${S.sel.size ? "" : "disabled"}>${S.sel.size ? `Turn ${plural(S.sel.size, "NFT")} into ${fmtUnits(per * BigInt(S.sel.size))} ${esc(c.symbol)}` : "Pick NFTs to turn into coins"}</button>
    <div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">
      <b class="small">Coins → NFT</b>
      <div class="mut small" style="margin-top:2px">You have ${fmtUnits(S.bal.coin)} ${esc(c.symbol)} · ${c.vaultSize} NFTs in the vault</div>
      <div class="qty" style="margin-top:10px"><button class="ghost" id="nMinus">−</button><input id="nBack" value="${maxBack ? 1 : 0}" inputmode="numeric"><button class="ghost" id="nPlus">+</button></div>
      <button class="wide ghost" id="toNftsBtn" style="margin-top:10px" ${maxBack ? "" : "disabled"}>${maxBack ? `Turn ${fmtUnits(per)} ${esc(c.symbol)} into 1 NFT` : canNfts ? "The vault is empty" : `You need ${fmtUnits(per)} ${esc(c.symbol)} for 1 NFT`}</button>
      <div id="gotNfts"></div>
    </div>
    <div class="err" id="convErr"></div>
  </div>`;
}
function feesPanel() {
  const c = S.info, p = S.pending;
  if (!p) return "";
  const has = p.eth > 0n || p.coins > 0n;
  return `<div class="card">
    <div class="row between"><h2>Trading fees</h2><span class="mut tiny">half to the creator</span></div>
    <div class="small" style="margin-top:6px">${has ? `Waiting to be paid out: <b class="mono">${fmtEth(p.eth, 8)}</b> + <b class="mono">${fmtUnits(p.coins)} ${esc(c.symbol)}</b>` : "Nothing to pay out yet."}</div>
    <button class="ghost wide sm" id="feesBtn" style="margin-top:10px" ${has ? "" : "disabled"}>Pay out fees</button>
    <div class="err" id="feesErr"></div>
  </div>`;
}

function wire() {
  const c = S.info, col = () => new ethers.Contract(S.addr, COLLECTION_ABI, signer);
  // mint
  if ($("mintBtn")) {
    const upd = () => {
      const max = mintLeft(); let q = Math.floor(Number($("qty").value) || 0);
      if (q > max) q = max; if (q < 1) q = max ? 1 : 0; $("qty").value = q;
      $("mintBtn").textContent = q ? `Mint ${plural(q, "NFT")} · ${fmtEth(c.mintPrice * BigInt(q))}` : "Nothing left to mint";
      $("mintBtn").disabled = !q;
      $("mintNote").textContent = q && c.minted + BigInt(q) >= c.publicCap ? "This is the last mint: it also opens the Uniswap pool, so it costs more gas." : "";
    };
    $("qMinus").onclick = () => { $("qty").value = Number($("qty").value) - 1; upd(); };
    $("qPlus").onclick = () => { $("qty").value = Number($("qty").value) + 1; upd(); };
    $("qty").oninput = upd; upd();
    $("mintBtn").onclick = async () => {
      const q = Number($("qty").value); $("mintErr").textContent = "";
      try { await need(); $("mintBtn").disabled = true; await send("Mint", () => call(col(), "mint", [q], { value: c.mintPrice * BigInt(q) })); await refresh(); }
      catch (e) { $("mintErr").textContent = errMsg(e); $("mintBtn").disabled = false; }
    };
  }
  if ($("finBtn")) $("finBtn").onclick = async () => {
    try { await need(); $("finBtn").disabled = true; await send("Open trading", () => call(col(), "finalize")); await refresh(); }
    catch (e) { $("finErr").textContent = errMsg(e); $("finBtn").disabled = false; }
  };
  // trade
  if ($("tradeBtn")) {
    $("sBuy").onclick = () => { S.side = "buy"; render(); };
    $("sSell").onclick = () => { S.side = "sell"; render(); };
    if ($("amtMax")) $("amtMax").onclick = () => { $("amt").value = ethers.formatEther(S.bal.coin); quote(); };
    let qt; $("amt").oninput = () => { clearTimeout(qt); qt = setTimeout(quote, 250); };
    $("tradeBtn").onclick = trade;
  }
  // convert
  if ($("nfts")) $("nfts").onclick = (e) => {
    const t = e.target.closest(".nft"); if (!t) return;
    const id = Number(t.dataset.id);
    if (S.sel.has(id)) S.sel.delete(id); else if (S.sel.size < 50) S.sel.add(id); else toast("Up to 50 NFTs at a time.");
    render();
  };
  if ($("selAll")) $("selAll").onclick = () => { if (S.sel.size === Math.min(S.my.length, 50)) S.sel.clear(); else S.sel = new Set(S.my.slice(0, 50)); render(); };
  if ($("toCoinsBtn")) $("toCoinsBtn").onclick = async () => {
    try { await need(); $("toCoinsBtn").disabled = true; const ids = [...S.sel]; await send("NFT → coins", () => call(col(), "toCoins", [ids])); S.sel.clear(); await refresh(); }
    catch (e) { $("convErr").textContent = errMsg(e); $("toCoinsBtn").disabled = false; }
  };
  if ($("toNftsBtn")) {
    const per = c.perNFT, maxBack = () => Math.min(50, per > 0n ? Number(S.bal.coin / per) : 0, Number(c.vaultSize));
    const upd = () => {
      let n = Math.floor(Number($("nBack").value) || 0); const m = maxBack();
      if (n > m) n = m; if (n < 1) n = m ? 1 : 0; $("nBack").value = n;
      if (n) $("toNftsBtn").textContent = `Turn ${fmtUnits(per * BigInt(n))} ${c.symbol} into ${plural(n, "NFT")}`;
      $("toNftsBtn").disabled = !n;
    };
    $("nMinus").onclick = () => { $("nBack").value = Number($("nBack").value) - 1; upd(); };
    $("nPlus").onclick = () => { $("nBack").value = Number($("nBack").value) + 1; upd(); };
    $("nBack").oninput = upd; upd();
    $("toNftsBtn").onclick = async () => {
      const n = Number($("nBack").value);
      try {
        await need(); $("toNftsBtn").disabled = true;
        const rc = await send("Coins → NFT", () => call(col(), "toNFTs", [n]));
        const ev = rc.logs.map((l) => { try { return col().interface.parseLog(l); } catch { return null; } }).find((x) => x && x.name === "ToNFTs");
        await refresh();
        if (ev) $("gotNfts").innerHTML = `<div class="small ok" style="margin-top:10px">You got:</div><div class="got">${ev.args.ids.map((id) => `<img alt="#${id}" title="#${id}" src="${artUrl(c.seed, Number(id), c.symbol)}">`).join("")}</div>`;
      } catch (e) { $("convErr").textContent = errMsg(e); $("toNftsBtn").disabled = false; }
    };
  }
  if ($("feesBtn")) $("feesBtn").onclick = async () => {
    try { const s = await need(); $("feesBtn").disabled = true; await send("Fees paid out", () => call(new ethers.Contract(CFG.factory, FACTORY_ABI, s), "collectFees", [S.addr])); await refresh(); }
    catch (e) { $("feesErr").textContent = errMsg(e); $("feesBtn").disabled = false; }
  };
}

function amountIn() {
  try { const v = ethers.parseEther(($("amt").value || "").trim() || "0"); return v > 0n ? v : null; } catch { return null; }
}
async function getQuote(zeroForOne, amt) {
  const q = new ethers.Contract(CFG.v4.quoter, QUOTER_ABI, rp);
  const [out] = await q.quoteExactInputSingle.staticCall([keyOf(S.info.coin), zeroForOne, amt, "0x"]);
  return out;
}
async function quote() {
  const c = S.info, amt = amountIn(), el = $("quote"); if (!el) return;
  $("tradeErr").textContent = "";
  if (!amt) { el.textContent = ""; return; }
  el.textContent = "Getting a quote…";
  try {
    const out = await getQuote(S.side === "buy", amt);
    if (amountIn() !== amt) return;
    el.innerHTML = S.side === "buy"
      ? `You get about <b class="mono">${fmtUnits(out)} ${esc(c.symbol)}</b>${out >= c.perNFT ? ` · enough for ${plural(Number(out / c.perNFT), "NFT")}` : ""}`
      : `You get about <b class="mono">${fmtEth(out, 8)}</b>`;
  } catch (e) { el.textContent = "Couldn't get a quote: " + errMsg(e); }
}
async function trade() {
  const c = S.info, amt = amountIn(), btn = $("tradeBtn"), buy = S.side === "buy";
  $("tradeErr").textContent = "";
  if (!amt) { $("tradeErr").textContent = "Enter an amount."; return; }
  try {
    const s = await need();
    btn.disabled = true;
    if (buy ? amt > S.bal.eth : amt > S.bal.coin) throw new Error(buy ? `Not enough ${NET}: you have ${fmtEth(S.bal.eth)}. Get free test ETH from the links at the top.` : `Not enough ${c.symbol}.`);
    const out = await getQuote(buy, amt);
    const minOut = (out * 97n) / 100n;
    if (!buy) {
      const coin = new ethers.Contract(c.coin, COIN_ABI, s);
      if ((await coin.allowance(account, CFG.v4.permit2)) < amt) await send("Approve", () => call(coin, "approve", [CFG.v4.permit2, ethers.MaxUint256]));
      const p2 = new ethers.Contract(CFG.v4.permit2, PERMIT2_ABI, s);
      const [allowed, expiration] = await p2.allowance(account, c.coin, CFG.v4.universalRouter);
      if (allowed < amt || Number(expiration) < now() + 600) await send("Allow trading", () => call(p2, "approve", [c.coin, CFG.v4.universalRouter, (1n << 160n) - 1n, now() + 30 * 86400]));
    }
    const params = coder.encode([`tuple(${KEY_T},bool,uint128,uint128,bytes)`], [[keyOf(c.coin), buy, amt, minOut, "0x"]]);
    const inCur = buy ? ethers.ZeroAddress : c.coin, outCur = buy ? c.coin : ethers.ZeroAddress;
    const input = coder.encode(["bytes", "bytes[]"], ["0x060c0f", [params, coder.encode(["address", "uint256"], [inCur, amt]), coder.encode(["address", "uint256"], [outCur, minOut])]]);
    const router = new ethers.Contract(CFG.v4.universalRouter, ROUTER_ABI, s);
    await send(buy ? "Buy" : "Sell", () => call(router, "execute", ["0x10", [input], now() + 900], { value: buy ? amt : 0n }));
    $("amt").value = "";
    await refresh();
  } catch (e) { $("tradeErr").textContent = errMsg(e); }
  finally { if ($("tradeBtn")) $("tradeBtn").disabled = false; }
}

route();
})();
</script>
</body>
</html>
